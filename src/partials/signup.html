<section class="section signup">
  <div class="shell signup__inner">
    <div data-reveal>
      <p class="eyebrow">Thursday, 9am</p>
      <h2 class="display d2" style="margin-top:1rem">First look at<br><em class="italic">everything new.</em></h2>
    </div>
    <div data-reveal data-delay="1">
      <p class="lede">The archive is restocked once a week and the good pieces rarely last the morning. Subscribers see them first.</p>
      <form class="field" style="margin-top:2rem" data-demo-form="Thank you — check your inbox on Thursday." novalidate>
        <label class="visually-hidden" for="signup-email">Email address</label>
        <input id="signup-email" type="email" name="email" placeholder="your@email.com" required autocomplete="email">
        <button type="submit">Subscribe</button>
      </form>
      <p class="form-msg" data-form-msg role="status" aria-live="polite"></p>
      <p class="form-note">One email a week. Unsubscribe whenever you like.</p>
    </div>
  </div>
</section>
