# Fly.io config. Change `app` to a name of your own before deploying —
# it has to be unique across Fly, and it becomes <app>.fly.dev.
app = "sponsorship-ledger"
primary_region = "iad"          # pick the region closest to you: fly platform regions

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  CRM_DB_PATH = "/data/crm.db"  # on the mounted volume, so it survives deploys

# The database lives here. Created with:
#   fly volumes create ledger_data --size 1 --region iad
[mounts]
  source = "ledger_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"   # sleeps when idle; first hit after that takes a second
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/login"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
