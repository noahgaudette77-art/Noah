<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#15131c}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script src="/vendor/three.min.js"></script>
<script src="/vendor/GLTFLoader.js"></script>
<script src="/vendor/meshopt_decoder.js"></script>
<script src="/tools/gen/vendor/RoomEnvironment.js"></script>
<script>
// Turnaround renderer for candidate models: six views in one row, neutral studio light.
// window.show(url, {views, size, bg, exposure}) -> stats
const VIEWS = { front: [0, 8], q: [38, 18], side: [90, 8], rear: [180, 8], rq: [218, 18], top: [0, 89], low: [20, -20], game: [197, 30], gamer: [163, 30], behind: [180, 16], hero: [28, 12], under: [200, -35] };
let renderer, pmrem, env;
async function show(url, o = {}) {
  const size = o.size || 420, names = o.views || ["front", "q", "side", "rear", "rq", "top"];
  const canvas = document.getElementById("c");
  if (!renderer) {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    pmrem = new THREE.PMREMGenerator(renderer);
    env = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;
  }
  renderer.toneMappingExposure = o.exposure || 1.0;
  renderer.setPixelRatio(1);
  renderer.setSize(size * names.length, size, false);
  canvas.style.width = size * names.length + "px"; canvas.style.height = size + "px";
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(o.bg === undefined ? 0x2a2733 : o.bg);
  scene.environment = env;
  const key = new THREE.DirectionalLight(0xffffff, 1.1); key.position.set(3, 5, 4); scene.add(key);
  const rim = new THREE.DirectionalLight(0x88aaff, 0.6); rim.position.set(-4, 3, -5); scene.add(rim);
  const loader = new THREE.GLTFLoader();
  loader.setMeshoptDecoder(MeshoptDecoder);
  const gltf = await new Promise((res, rej) => loader.load(url, res, undefined, rej));
  const root = gltf.scene;
  if (o.rotY) root.rotation.y = o.rotY;
  scene.add(root);
  root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(root), c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
  const stats = { tris: 0, verts: 0, meshes: 0, skinned: 0, materials: [], textures: [], size: [s.x, s.y, s.z].map((v) => +v.toFixed(3)), min: box.min.toArray().map((v) => +v.toFixed(3)), max: box.max.toArray().map((v) => +v.toFixed(3)), animations: (gltf.animations || []).map((a) => a.name + ":" + a.duration.toFixed(2)), nodes: [] };
  const seenM = new Set(), seenT = new Set();
  root.traverse((n) => {
    if (n.isMesh) {
      stats.meshes++; if (n.isSkinnedMesh) stats.skinned++;
      const g = n.geometry; stats.tris += (g.index ? g.index.count : g.attributes.position.count) / 3; stats.verts += g.attributes.position.count;
      if (stats.nodes.length < 60) stats.nodes.push(n.name);
      (Array.isArray(n.material) ? n.material : [n.material]).forEach((m) => {
        if (seenM.has(m)) return; seenM.add(m);
        if (o.emissiveBoost && m.emissiveMap) m.emissiveIntensity = o.emissiveBoost; if (o.envI !== undefined) m.envMapIntensity = o.envI;
        const t = {};
        for (const k of ["map", "normalMap", "roughnessMap", "metalnessMap", "emissiveMap", "aoMap"]) if (m[k]) { const im = m[k].image; t[k] = im ? im.width + "x" + im.height : "?"; if (!seenT.has(m[k])) { seenT.add(m[k]); stats.textures.push(k + " " + t[k]); } }
        stats.materials.push({ name: m.name, type: m.type, metal: m.metalness, rough: m.roughness, color: m.color && "#" + m.color.getHexString(), emissive: m.emissive && "#" + m.emissive.getHexString(), tex: t, transparent: m.transparent, side: m.side });
      });
    }
  });
  stats.tris = Math.round(stats.tris);
  const R = 0.5 * Math.sqrt(s.x * s.x + s.y * s.y + s.z * s.z);
  const cam = new THREE.PerspectiveCamera(30, 1, R * 0.05, R * 30);
  const dist = (R / Math.sin(THREE.MathUtils.degToRad(15))) * (o.zoom || 0.92);
  renderer.setScissorTest(true);
  // flat (orthographic) views, for checking a centreline and symmetry: ftop, fside, ffront, frear
  const FLAT = { ftop: [0, 90], fside: [90, 0], ffront: [0, 0], frear: [180, 0], funder: [0, -90] };
  const half = R * 1.02, ortho = new THREE.OrthographicCamera(-half, half, half, -half, R * 0.05, R * 30);
  names.forEach((n, i) => {
    const flat = FLAT[n], [az, el] = flat || VIEWS[n], a = THREE.MathUtils.degToRad(az), e = THREE.MathUtils.degToRad(el), cm = flat ? ortho : cam;
    cm.position.set(c.x + dist * Math.sin(a) * Math.cos(e), c.y + dist * Math.sin(e), c.z + dist * Math.cos(a) * Math.cos(e));
    cm.up.set(0, 1, 0); if (Math.abs(el) > 85) cm.up.set(0, 0, el > 0 ? -1 : 1);
    cm.lookAt(c);
    renderer.setViewport(i * size, 0, size, size); renderer.setScissor(i * size, 0, size, size);
    renderer.render(scene, cm);
  });
  window.__scene = scene; window.__gltf = gltf; window.__cam = { cam, c, dist, size, n: names.length };
  return stats;
}
window.show = show;
// One row of a clip: `frames` tiles sampled evenly across clip `index`, all from the view `name` (after show()).
window.animRow = (index, frames, name) => {
  const gltf = window.__gltf, { cam, c, dist, size } = window.__cam, clip = gltf.animations[index];
  const mixer = new THREE.AnimationMixer(gltf.scene), act = mixer.clipAction(clip);
  act.play();
  const [az, el] = VIEWS[name || "q"], a = THREE.MathUtils.degToRad(az), e = THREE.MathUtils.degToRad(el);
  cam.position.set(c.x + dist * Math.sin(a) * Math.cos(e), c.y + dist * Math.sin(e), c.z + dist * Math.cos(a) * Math.cos(e));
  cam.up.set(0, 1, 0); cam.lookAt(c);
  for (let i = 0; i < frames; i++) {
    mixer.setTime(clip.duration * (i / frames));
    gltf.scene.updateMatrixWorld(true);
    renderer.setViewport(i * size, 0, size, size); renderer.setScissor(i * size, 0, size, size);
    renderer.render(window.__scene, cam);
  }
  mixer.stopAllAction(); mixer.uncacheRoot(gltf.scene);
  return { name: clip.name, duration: +clip.duration.toFixed(2), tracks: clip.tracks.length };
};
</script></body></html>
