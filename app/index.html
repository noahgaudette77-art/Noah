<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meridian</title>
<meta name="description" content="A personal intelligence platform: primary-source signal, an authored causal model of the world, and a learning system built on top of both.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b0e13">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cpath d='M10 1.6 18 6v8l-8 4.4L2 14V6l8-4.4Z' fill='none' stroke='%23f0a02a' stroke-width='1.4' stroke-linejoin='round'/%3E%3Cpath d='M10 6.4 13.6 8.4v3.4L10 13.8 6.4 11.8V8.4L10 6.4Z' fill='%23f0a02a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/components.css">
<script>
  // Applied before first paint so the shell never flashes the wrong theme.
  try {
    const stored = JSON.parse(localStorage.getItem("pios.v1.profile") || "{}");
    if (stored.settings?.theme) document.documentElement.dataset.theme = stored.settings.theme;
    if (stored.settings?.density) document.documentElement.dataset.density = stored.settings.density;
  } catch {}
</script>
</head>
<body>
<a href="#main" class="sr-only">Skip to content</a>
<div id="app" data-rail="expanded">
  <noscript>
    <div style="padding:48px;max-width:60ch;margin:0 auto;font-family:system-ui">
      <h1 style="font-size:24px">Meridian</h1>
      <p style="color:#a8b4c4;line-height:1.6">This application is a client-side analysis tool and needs JavaScript.
      The underlying data is plain JSON and can be read directly from the
      <code>data/</code> directory of the repository if you would rather not run it.</p>
    </div>
  </noscript>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
